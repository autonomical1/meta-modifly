# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "new" branch
  push:
    branches: [ "new" ]
  pull_request:
    branches: [ "new" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Clone Yocto Git Repos
        run:
          cd ..
          git clone https://git.yoctoproject.org/poky -b styhead
          git clone https://github.com/openembedded/meta-openembedded -b styhead
          git clone https://github.com/OE4T/meta-tegra -b styhead

      - name: Install apt-based dependencies
        uses: gerlero/apt-install@v1.3.10
        with:
          # APT packages to install
          packages: build-essential chrpath cpio debianutils diffstat file gawk gcc git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd
      - name: Build Yocto Image
        run: |
          cd poky
          source oe-init-build-env
          bitbake modifly-image
        
